repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: mixed-line-ending
  - repo: local
    hooks:
      - id: lyricvid-no-secrets
        name: LyricVid credential validation
        entry: ./scripts/validate-no-secrets.sh
        language: system
        pass_filenames: false
