[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricvid"
version = "0.9.2"
description = "Whisper-aligned Remotion lyric videos, visualizers, voice-over compositions, and YouTube publishing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LyricVid"}]
dependencies = [
  "faster-whisper>=1.1,<2",
  "mutagen>=1.47,<2",
  "google-api-python-client>=2.140,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1"
]

[project.urls]
Homepage = "https://github.com/iamrichmack111/lyricvid-cli"
Repository = "https://github.com/iamrichmack111/lyricvid-cli"
Issues = "https://github.com/iamrichmack111/lyricvid-cli/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "pre-commit>=4",
  "twine>=5"
]

[project.scripts]
lyricvid = "lyricvid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lyricvid = [
  "remotion_runtime/package.json",
  "remotion_runtime/src/*.ts",
  "remotion_runtime/src/*.tsx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["lyricvid"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
