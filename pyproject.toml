[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricvid"
version = "0.2.0"
description = "Create Whisper-aligned Remotion lyric videos from any music folder"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LyricVid"}]
dependencies = [
  "faster-whisper>=1.1,<2",
  "mutagen>=1.47,<2"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5"
]

[project.scripts]
lyricvid = "lyricvid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lyricvid = [
  "remotion_runtime/package.json",
  "remotion_runtime/src/*.ts",
  "remotion_runtime/src/*.tsx"
]
