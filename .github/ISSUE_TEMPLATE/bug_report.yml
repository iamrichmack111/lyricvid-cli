name: Bug report
description: Report a reproducible LyricVid defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command and minimal steps. Remove credentials and private media.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste `lyricvid --doctor` output. Do not paste OAuth JSON or tokens.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Lyrics/alignment, Remotion/rendering, YouTube upload, Installation, CI/CD, Documentation, Other]
