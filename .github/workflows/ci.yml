name: CI - Test, Build, Render Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test/build tooling
        run: |
          python -m pip install -U pip build pytest mutagen twine
          python -m pip install --no-deps -e .

      - name: Test and build
        run: |
          python -m compileall -q src
          pytest -q
          python -m build
          twine check dist/*

      - name: Test installed CLI
        run: |
          python -m pip uninstall -y lyricvid
          python -m pip install --no-deps dist/*.whl
          lyricvid --version
          lyricvid --help

      - name: Upload package
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: lyricvid-installable-package
          path: dist/*

  render-demo:
    name: Render real demo video
    needs: test-package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install LyricVid
        run: python -m pip install --no-deps -e .

      - name: Render MP4
        run: |
          lyricvid --demo -o ci-demo --jobs 2 --crf 30
          test -s ci-demo/lyricvid-demo.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v7
        with:
          name: lyricvid-demo-video
          path: ci-demo/lyricvid-demo.mp4
          if-no-files-found: error
