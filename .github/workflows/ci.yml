name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test/build tooling
        run: |
          python -m pip install -U pip build pytest mutagen twine
          python -m pip install --no-deps -e .

      - name: Compile Python
        run: python -m compileall -q src

      - name: Unit tests
        run: pytest -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Install built CLI smoke test
        run: |
          python -m pip uninstall -y lyricvid
          python -m pip install --no-deps dist/*.whl
          lyricvid --version
          lyricvid --help

      - name: Upload package artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: lyricvid-python-dist
          path: dist/*

  remotion-runtime:
    name: Remotion runtime
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/lyricvid/remotion_runtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate pinned Remotion versions
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const d = pkg.dependencies;
          const versions = new Set([
            d.remotion,
            d['@remotion/cli'],
            d['@remotion/media'],
          ]);
          if (versions.size !== 1) {
            throw new Error(`Remotion packages must match: ${[...versions].join(', ')}`);
          }
          console.log(`Remotion packages aligned at ${[...versions][0]}`);
          NODE

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle smoke test
        run: npx remotion compositions src/index.ts
