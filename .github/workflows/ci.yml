name: CI - Validate, Test, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate shell scripts
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

      - name: Validate no credentials are tracked
        run: |
          ./scripts/validate-no-secrets.sh
          python scripts/secret-guard.py --self-test
          python scripts/secret-guard.py

      - name: Validate package metadata
        run: |
          python - <<'PY'
          import pathlib, re
          pyproject = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          init = pathlib.Path('src/lyricvid/__init__.py').read_text(encoding='utf-8')
          package_version = re.search(r'^version = "([^"]+)"', pyproject, re.M).group(1)
          init_version = re.search(r'__version__\s*=\s*["\']([^"\']+)', init).group(1)
          if package_version != init_version:
              raise SystemExit(f'version mismatch: pyproject={package_version}, __init__={init_version}')
          print('Version:', package_version)
          PY

      - name: Validate D2 source when available
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --prefix "$HOME/.local"
          "$HOME/.local/bin/d2" --version
          "$HOME/.local/bin/d2" docs/architecture.d2 /tmp/architecture.svg
          test -s /tmp/architecture.svg

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: python -m pip install --upgrade pip pip-audit bandit

      - name: Audit Python dependencies
        run: |
          python - <<'PY' > /tmp/runtime-requirements.txt
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              project = tomllib.load(f)
          for dep in project['project']['dependencies']:
              print(dep)
          PY
          pip-audit -r /tmp/runtime-requirements.txt

      - name: Static security analysis
        run: bandit -q -r src/lyricvid -x '*/remotion_runtime/*' -ll

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit Remotion runtime dependencies
        working-directory: src/lyricvid/remotion_runtime
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip build pytest pytest-cov twine
          python -m pip install -e .

      - name: Compile and test
        run: |
          python -m compileall -q src
          if [ "${{ matrix.python }}" = "3.12" ]; then
            pytest -q --cov=lyricvid --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=15
          else
            pytest -q
          fi

      - name: Upload coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Build and validate distributions
        if: matrix.python == '3.12'
        run: |
          python -m build
          twine check dist/*

      - name: Upload installable package
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: lyricvid-python-package
          path: dist/*
          if-no-files-found: error

  container-validate:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: lyricvid:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
