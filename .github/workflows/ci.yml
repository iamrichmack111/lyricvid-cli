name: CI/CD - Build and Render Cluster Heartbeat

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test and build LyricVid
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          python -m pip install -U pip build pytest mutagen twine
          python -m pip install --no-deps -e .

      - name: Test package
        run: |
          python -m compileall -q src
          pytest -q
          python -m build
          twine check dist/*

      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: lyricvid-installable-package
          path: dist/*
          if-no-files-found: error

  render:
    name: Render Cluster_Heartbeat.mp3
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U pip
          python -m pip install -e .

      - name: Confirm song exists
        run: test -s Cluster_Heartbeat.mp3

      - name: Render actual lyric video
        run: |
          lyricvid . \
            --model tiny.en \
            --force \
            --jobs 2 \
            --crf 30 \
            --output ci-video
          test -n "$(find ci-video -name '*.mp4' -type f -size +0c -print -quit)"

      - name: Upload finished video
        uses: actions/upload-artifact@v7
        with:
          name: cluster-heartbeat-video
          path: |
            ci-video/*.mp4
            ci-video/alignment-report.json
          if-no-files-found: error
          retention-days: 30
