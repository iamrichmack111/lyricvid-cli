name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository has no tracked credentials
        run: ./scripts/validate-no-secrets.sh

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('pyproject.toml').read_text()
          version = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match package version v{version}')
          print('Release version:', version)
          PY

      - name: Build distributions
        run: python -m build

      - name: Generate CycloneDX SBOM
        run: ./scripts/generate-sbom.sh dist

      - name: Validate distributions
        run: twine check dist/*.whl dist/*.tar.gz

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyricvid-release-dist
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
